version: '3.8'

services:
  mysqldb:
    image: mysql:8.4
    container_name: shopy-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Bhushan@1234
      MYSQL_DATABASE: shopora_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  app:
    build: .
    container_name: shopy-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/shopora_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: Bhushan@1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      PORT: 8080
    depends_on:
      - mysqldb

volumes:
  mysql_data:
