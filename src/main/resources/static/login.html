<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>SHOPY — Client Sign In</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,400..600&family=Playfair+Display:ital,wght@0,400..800;1,400..700&display=swap" rel="stylesheet"/>
  
  <link rel="stylesheet" href="/shopy-brand.css"/>
  <link rel="stylesheet" href="/style.css"/>
  <link rel="stylesheet" href="/login.css"/>
</head>
<body style="background-color: var(--paper);">

  <!-- Navbar -->
  <header style="background: white; border-bottom: 1px solid var(--line); padding: 18px 36px; display: flex; justify-content: space-between; align-items: center;">
    <a href="/" class="site-logo">SHOPY<span class="dot">.</span></a>
    <a href="/" class="link-underline">← RETURN TO STORE</a>
  </header>

  <main style="min-height: calc(100vh - 140px); display: flex; align-items: center; justify-content: center; padding: 40px 20px;">
    <div style="background: white; border: 1px solid var(--line); border-top: 3px solid var(--wine); border-radius: 8px; width: 100%; max-width: 480px; padding: 44px; box-shadow: 0 16px 40px rgba(0,0,0,0.04);">
      <p class="eyebrow-label" style="text-align: center; margin-bottom: 8px;">WELCOME BACK</p>
      <h1 style="font-family: var(--serif); font-size: 34px; font-weight: 500; text-align: center; margin: 0 0 12px; letter-spacing: -1px;">
        Sign in to your account.
      </h1>
      <p style="text-align: center; font-size: 13px; color: var(--muted); margin: 0 0 32px;">
        Access your orders, saved pieces, and streamlined checkout.
      </p>

      <form id="loginForm" style="display: flex; flex-direction: column; gap: 20px;">
        <div>
          <label for="username" style="display: block; font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase; margin-bottom: 6px;">Username</label>
          <input type="text" id="username" name="username" required placeholder="Enter your username" autocomplete="username" style="width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; font-size: 14px; outline: none;"/>
        </div>

        <div>
          <div style="display: flex; justify-content: space-between; margin-bottom: 6px;">
            <label for="password" style="font-size: 11px; font-weight: 800; letter-spacing: 0.8px; text-transform: uppercase;">Password</label>
          </div>
          <input type="password" id="password" name="password" required placeholder="Enter your password" autocomplete="current-password" style="width: 100%; height: 46px; border: 1px solid var(--line); border-radius: 4px; padding: 0 14px; font-size: 14px; outline: none;"/>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn-shopy-primary" style="height: 50px; margin-top: 10px; font-size: 12px; width: 100%;">
          SIGN IN
        </button>
      </form>

      <div style="text-align: center; margin-top: 28px; font-size: 13px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 20px;">
        New to SHOPY? <a href="/register.html" style="color: var(--ink); font-weight: 700; text-decoration: underline;">Create an account</a>
      </div>
    </div>
  </main>

  <script src="/shopy-core.js"></script>
  <script src="/login.js"></script>
  <script src="/shopy-ui.js"></script>
</body>
</html>
